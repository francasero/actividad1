stages:
  visualizacion:
    cmd: python src/visualizacion.py
    deps:
      - src/visualizacion.py
      - data/raw/datos_clientes.csv
      - data/raw/datos_resenas.csv
    outs:
      - reports/figures

  perfilado:
    cmd: python src/perfilado.py
    deps:
      - src/perfilado.py
      - data/raw/datos_clientes.csv
      - data/raw/datos_resenas.csv
    outs:
      - reports/perfilado

  preparacion:
    cmd: python src/preparacion.py
    deps:
      - src/preparacion.py
      - data/raw/datos_clientes.csv
      - data/raw/datos_resenas.csv
    outs:
      - data/processed/datos_integrados.csv
      - reports/reporte_transformaciones.md:
          cache: false