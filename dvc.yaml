stages:
  visualizacion:
    cmd: python src/visualizacion.py
    deps:
      - src/visualizacion.py
      - data/raw/datos_clientes.csv
      - data/raw/datos_resenas.csv
    outs:
      - reports/figures

  perfilado:
    cmd: python src/perfilado.py
    deps:
      - src/perfilado.py
      - data/raw/datos_clientes.csv
      - data/raw/datos_resenas.csv
    outs:
      - reports/perfilado

  preparacion:
    cmd: python src/preparacion.py
    deps:
      - src/preparacion.py
      - data/raw/datos_clientes.csv
      - data/raw/datos_resenas.csv
    outs:
      - data/processed/datos_integrados.csv
      - reports/reporte_transformaciones.md:
          cache: false

  calidad:
    cmd: pytest tests/test_calidad_datos.py -v --html=reports/reporte_calidad.html --self-contained-html
    deps:
      - tests/test_calidad_datos.py
      - data/raw/datos_clientes.csv
      - data/raw/datos_resenas.csv
      - data/processed/datos_integrados.csv
    outs:
      - reports/reporte_calidad.html:
          cache: false


  entrenamiento:
    cmd: python -m src.train_model
    deps:
      - src/train_model.py
      - data/processed/datos_integrados.csv
    outs:
      - models/trained_model.pkl
    metrics:
      - metrics/train_metrics.json:
          cache: false